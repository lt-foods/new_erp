name: Deploy admin to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Use `npm install` instead of `npm ci` because the monorepo may contain
      # workspaces (e.g. apps/member) that aren't yet in package-lock.json.
      # For admin deploy we only need deterministic install of admin itself.
      - run: npm install --no-audit --no-fund

      - name: Build admin (static export)
        working-directory: apps/admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # 下面兩個值與 apps/admin/public/CNAME 是同一個決定（2026-09-12 改用自訂網域
          # erp.www161616.com）。換網域時這三處要一起改，只改一處會不一致。
          # basePath：站台掛在網域根目錄，網址不再有 /new_erp 這一截，故留空。
          NEXT_PUBLIC_BASE_PATH: ""
          # siteUrl：/welcome/ 的 OG 分享縮圖需要絕對網址。末尾不要加斜線
          #（程式端 welcome/page.tsx 仍會去掉多餘斜線，但這裡就別寫進去）。
          NEXT_PUBLIC_SITE_URL: https://erp.www161616.com
        run: npm run build

      - name: Add .nojekyll
        run: touch apps/admin/out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages 只是跟 Pages 說「上線這包」再輪詢狀態，正常 30~60 秒就結束。
    # 2026-08-06 遇過 Pages 佇列塞住：狀態卡在 deployment_queued 整整 10 分鐘
    # （action 預設 timeout 600000ms）才 abort，期間 concurrency group "pages"
    # 被佔住，後面排隊的 run 一起延後。縮短到 6 分鐘 —— 仍是正常耗時的 6 倍以上，
    # 但塞住時能快點翻掉重試，不用盯著等。timeout-minutes 是 runner 層的保險，
    # 避免 action 自己的計時失靈時整個 job 掛著。
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 360000
